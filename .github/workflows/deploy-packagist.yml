name: Deploy to Packagist

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-release'

permissions:
  contents: write

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Tag Format (X.X.X-release)
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Evaluating tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-release$ ]]; then
            echo "::error::Tag '${TAG}' does not match required format 'X.X.X-release' (no 'v' prefix, digits only)."
            exit 1
          fi
          echo "Tag '${TAG}' is valid."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, openssl, redis
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Static Analysis & Tests
        run: composer verify

  deploy:
    name: Deploy to Packagist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Packagist Package Update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "::error::Missing PACKAGIST_USERNAME or PACKAGIST_TOKEN secrets in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Notifying Packagist for tag: ${GITHUB_REF_NAME}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/andre1502/net_utilities"}}')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Packagist API HTTP Status: ${HTTP_STATUS}"
          echo "Packagist API Response: ${BODY}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "Successfully notified Packagist for ${GITHUB_REF_NAME}!"
          else
            echo "::error::Packagist API update failed with status ${HTTP_STATUS}: ${BODY}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing GitHub release for ${GITHUB_REF_NAME}..."
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
